[package]
name = "zhtw-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "MCP server for Traditional Chinese (zh-TW) text linting and normalization"
license = "MIT"
repository = "https://github.com/sysprog21/zhtw-mcp"
homepage = "https://github.com/sysprog21/zhtw-mcp"
categories = ["command-line-utilities", "text-processing", "internationalization"]
keywords = ["mcp", "chinese", "linting", "traditional-chinese", "zh-tw"]
readme = "README.md"
# tests/unit carries the unit test bodies that src modules reach with #[path],
# so a package without them cannot build its own test target.
include = ["src/**/*", "tests/unit/**/*", "assets/ruleset.json",
            "scripts/schema-facts.json", "Cargo.toml", "LICENSE", "README.md",
            "rust-toolchain.toml", "docs/cli.md", "build.rs",
            "build/help_blocks.rs"]

# Pinned OpenCC dictionary source for scripts/gen-s2t-tables.py.  Kept here,
# not in the script, so the dependency is declared where every other pinned
# dependency of this crate lives and `cargo metadata` can report it.
#
# To bump: change `commit`, run `python3 scripts/gen-s2t-tables.py`, and paste
# the printed source hash into `source-hash`.  The script refuses to generate
# if only one of the two moved, so a bump cannot be half-applied.
[package.metadata.opencc]
repository = "https://github.com/BYVoid/OpenCC"
commit = "5249273a3e5606852f088c9a8b23522145d94f78"
source-hash = "959b88f60c9dcc0d"

[features]
default = ["native", "translate"]
native = [
    "dep:dirs",
    "dep:dunce",
    "dep:fs2",
    "dep:rayon",
    "dep:rmcp",
    "dep:tempfile",
    "dep:tokio",
    "dep:toml",
]
browser-wasm = ["dep:console_error_panic_hook", "dep:wasm-bindgen"]
translate = ["dep:ureq", "dep:urlencoding"]

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "zhtw-mcp"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
aho-corasick = "1"
daachorse = "1"
regex = "1"
blake3 = "1"
rayon = { version = "1", optional = true }
anyhow = "1"
unicode-normalization = "0.1"
pulldown-cmark = { version = "0.13", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
dirs = { version = "7.0", optional = true }
dunce = { version = "1", optional = true }
tempfile = { version = "3.0", optional = true }
toml = { version = "1.1", optional = true }
ureq = { version = "3", optional = true }
urlencoding = { version = "2", optional = true }
rustc-hash = "2"
fs2 = { version = "0.4", optional = true }
postcard = { version = "1", default-features = false, features = ["alloc"] }
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
# Pinned to a major on purpose. SEP-2577 removes the sampling and logging
# capabilities this server still serves, and the release that drops them will
# not be a 3.x, so the next major bump is the moment to revisit the six
# deprecation allows in src/mcp/sdk.rs rather than to silence them again.
rmcp = { version = "3", default-features = false, features = [
    "server",
    "transport-io",
], optional = true }
tokio = { version = "1", features = [
    "io-std",
    "io-util",
    "macros",
    "rt",
    "sync",
    "time",
], optional = true }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
# Only for `start_paused`, which lets the 30s drain timeout be tested without
# waiting 30s. Resolver v2 keeps a dev-only feature out of the release binary.
tokio = { version = "1", features = ["test-util"] }

[[bench]]
name = "scanner"
harness = false

[[bench]]
name = "startup"
harness = false

[profile.release]
lto = true
strip = true

# Optimize dependencies even in debug builds, but leave this crate at
# opt-level 0 so it stays debuggable.  serde_json unoptimized moves single-digit
# MB/s, and the cache tests have to push 32 MiB through it to reach
# `MAX_TOTAL_BYTES` at all; blake3, regex, and aho-corasick are on every scanner
# test's hot path for the same reason.  Costs one dependency rebuild.
[profile.dev.package."*"]
opt-level = 2

