<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>zhtw-mcp Page Checker</title>
    <link rel="stylesheet" href="styles/popup.css" />
  </head>
  <body>
    <main class="panel">
      <section class="hero" aria-label="掃描摘要">
        <p class="eyebrow">zhtw-mcp</p>
        <h1>正體用語檢查</h1>
        <div class="meter">
          <span id="count" class="meter__count">—</span>
          <span class="meter__label">警告 / 錯誤</span>
        </div>
        <p id="status" class="status" data-tone="idle">尚未掃描</p>
        <p id="meta" class="meta">按下檢查後，只會讀取目前分頁可見文字。</p>
      </section>

      <form id="scan-form" class="controls">
        <label class="field">
          <span>檢查強度</span>
          <select id="profile">
            <option value="base">Base：用語、標點、文法</option>
            <option value="strict">Strict：加入字形標準</option>
          </select>
        </label>
        <label class="field">
          <span>中文與英數字間距</span>
          <select id="spacing">
            <option value="require">Require：中文與英數字之間加空格</option>
            <option value="strip">Strip：移除空格，交給網頁排版</option>
          </select>
        </label>
        <label class="toggle">
          <input id="relaxed" type="checkbox" />
          <span>UI 文案模式：放寬部分標點與文法規則</span>
        </label>
        <label class="field">
          <span>輸入欄連續符號</span>
          <select id="symbol-handling">
            <option value="warn">Warn：顯示提醒</option>
            <option value="remove">Remove：移除非功能性符號</option>
            <option value="off">Off：不處理</option>
          </select>
        </label>
        <label class="field">
          <span>停用的規則家族（可複選）</span>
          <select id="off" multiple size="5">
            <option value="spelling">spelling：用語與詞彙</option>
            <option value="casing">casing：專有名詞大小寫</option>
            <option value="punctuation">punctuation：半形標點</option>
            <option value="quotes">quotes：引號轉換</option>
            <option value="spacing">spacing：中文與英數字間距</option>
            <option value="colon">colon：全形冒號</option>
            <option value="dunhao">dunhao：頓號</option>
            <option value="range">range：範圍符號</option>
            <option value="variant">variant：異體字</option>
            <option value="ellipsis">ellipsis：刪節號</option>
            <option value="grammar">grammar：文法</option>
            <option value="ai">ai：AI 語感</option>
            <option value="translationese">translationese：翻譯腔</option>
            <option value="rhythm">rhythm：氣口</option>
          </select>
        </label>
        <button id="scan-button" type="submit">檢查目前分頁</button>
      </form>

      <ol id="issue-list" class="issues" aria-label="掃描結果"></ol>
    </main>
    <script type="module" src="src/popup.js"></script>
  </body>
</html>
